[project]
name = "mem"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aioconsole>=0.8.2",
    "dspy>=3.0.3",
    "fastapi>=0.115.0",
    "google-genai>=2.25.0",
    "mem0ai>=0.1.118",
    "openai>=1.109.1",
    "psycopg[binary]>=3.2.3",
    "qdrant-client>=1.15.1",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["mem"]

[tool.uv.workspace]
members = [
    "local-qdrant",
]
