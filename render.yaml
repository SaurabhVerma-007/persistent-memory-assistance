databases:
  - name: mem0-memory-db
    databaseName: mem0_memory
    plan: free

services:
  - type: web
    name: mem0-memory-chat
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mem0-memory-db
          property: connectionString
