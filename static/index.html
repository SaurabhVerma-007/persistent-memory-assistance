<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEMORY_CHAT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #040805;
        --panel: #07110a;
        --fg: #39ff6a;        /* phosphor green */
        --ink: #c4ffd2;       /* assistant text */
        --muted: #5fa873;
        --line: rgba(57, 255, 106, 0.3);
        --c-retrieve: #5fd7ff;
        --c-candidates: #9aa7ff;
        --c-add: #39ff6a;
        --c-update: #ffb000;
        --c-delete: #ff5f56;
        --c-noop: #7c9c86;
        --c-summary: #c792ea;
        --c-error: #ff5f56;
        --mono: "IBM Plex Mono", "Courier New", monospace;
        --crt: "VT323", "IBM Plex Mono", "Courier New", monospace;
      }
      * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #1f7a3a transparent; }
      ::selection { background: var(--fg); color: var(--bg); }
      .hidden { display: none !important; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--fg);
        background: var(--bg);
        font: 400 14.5px/1.55 var(--mono);
        text-shadow: 0 0 5px rgba(57, 255, 106, 0.25);
      }
      /* CRT scanlines + vignette (purely visual, never blocks clicks) */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background:
          repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.16) 3px),
          radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%);
      }

      button { font-family: inherit; font-size: inherit; cursor: pointer; text-shadow: inherit; }
      button:disabled { cursor: wait; opacity: .5; }
      button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1px dashed var(--fg); outline-offset: 3px; }

      /* square, bracketed buttons: [ like this ] */
      .primary, .ghost, .tab, .auth-tabs button {
        color: var(--fg); background: transparent; border: 0; padding: 4px 6px; border-radius: 0;
      }
      .primary::before, .ghost::before, .tab::before, .auth-tabs button::before { content: "[ "; color: var(--muted); }
      .primary::after, .ghost::after, .tab::after, .auth-tabs button::after { content: " ]"; color: var(--muted); }
      .primary { font-weight: 700; }
      .ghost { color: var(--muted); }
      .primary:hover:not(:disabled), .ghost:hover:not(:disabled), .tab:hover, .auth-tabs button:hover {
        background: var(--fg); color: var(--bg); text-shadow: none;
      }
      .primary:hover::before, .primary:hover::after, .ghost:hover::before, .ghost:hover::after,
      .tab:hover::before, .tab:hover::after, .auth-tabs button:hover::before, .auth-tabs button:hover::after { color: var(--bg); }
      .tab.active, .auth-tabs button.active { background: var(--fg); color: var(--bg); text-shadow: none; }
      .tab.active::before, .tab.active::after, .auth-tabs button.active::before, .auth-tabs button.active::after { color: var(--bg); }

      h1 { margin: 0; font: 400 clamp(2.4rem, 6vw, 4rem)/1 var(--crt); letter-spacing: .04em; text-shadow: 0 0 10px rgba(57,255,106,.55); }
      h2 { margin: 0; font: 700 .9rem var(--mono); letter-spacing: .14em; text-transform: uppercase; }
      .eyebrow { margin: 0 0 6px; color: var(--muted); font-size: .8rem; }
      .eyebrow::before { content: "# "; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

      input, textarea {
        width: 100%; color: var(--fg); background: transparent; border: 0; border-radius: 0;
        font: inherit; text-shadow: inherit; caret-color: var(--fg);
      }
      input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }

      /* ---- login ---- */
      .auth { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      .auth-card { width: min(480px, 100%); padding: 24px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 40px rgba(57,255,106,.08); }
      .auth-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 16px 0 18px; }
      .auth form { display: flex; flex-direction: column; gap: 10px; }
      .field { display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed var(--line); padding: 4px 0; }
      .field span { flex-shrink: 0; width: 10ch; color: var(--muted); }
      .auth-error { min-height: 1.5em; margin: 0; color: var(--c-error); font-size: .88rem; }
      .auth-error:not(:empty)::before { content: "! "; }
      .auth-note { margin: 16px 0 0; color: var(--muted); font-size: .78rem; }
      .auth-note::before { content: "# "; }

      /* ---- app ---- */
      .wrap { width: min(1400px, 100%); margin: 0 auto; padding: 22px 20px; }
      .top { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding-bottom: 18px; }
      .who { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .panel { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 540px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 40px rgba(57,255,106,.06); overflow: hidden; }
      .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: rgba(57,255,106,.06); }
      .panel-head h2::before { content: "── "; color: var(--muted); }
      .panel-head h2::after { content: " ──"; color: var(--muted); }
      .head-actions { display: flex; align-items: center; gap: 10px; }
      .status { color: var(--muted); font-size: .8rem; }

      /* chat log */
      #messages { display: flex; flex: 1; flex-direction: column; gap: 10px; overflow: auto; padding: 14px 16px; }
      .message { max-width: 100%; white-space: pre-wrap; word-break: break-word; }
      .message.user { color: var(--fg); }
      .message.user::before { content: "> "; color: var(--muted); }
      .message.assistant { color: var(--ink); }
      .message.assistant::before { content: "ai: "; color: var(--muted); }
      .empty { margin: auto; max-width: 420px; color: var(--muted); text-align: center; line-height: 1.6; }
      #chat-form { display: flex; align-items: flex-start; gap: 8px; border-top: 1px dashed var(--line); padding: 10px 14px; }
      .prompt { padding-top: 5px; color: var(--fg); font-weight: 700; }
      #chat-form textarea { min-height: 34px; max-height: 140px; resize: vertical; padding: 5px 0; }

      /* stats */
      .stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px 4px; }
      .stat { display: flex; align-items: baseline; gap: 8px; padding: 3px 10px; border: 1px solid var(--line); }
      .stat span { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
      .stat b { font-weight: 700; font-size: 1.05rem; }
      .stat.add b { color: var(--c-add); } .stat.update b { color: var(--c-update); }
      .stat.delete b { color: var(--c-delete); } .stat.retrieve b { color: var(--c-retrieve); }
      .tabs { display: flex; gap: 4px; padding: 10px 14px 0; }
      .scroll { flex: 1; overflow: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; }

      /* activity log */
      .group { flex-shrink: 0; border: 1px solid var(--line); overflow: hidden; }
      .group-head { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: rgba(57,255,106,.06); }
      .group-title { font-weight: 500; word-break: break-word; }
      .group-title::before { content: "$ "; color: var(--muted); }
      .group-meta { flex-shrink: 0; text-align: right; color: var(--muted); font-size: .75rem; }
      .chip { display: inline-block; margin: 2px 8px 0 0; color: var(--muted); font-size: .78rem; }
      .chip::before { content: "#"; }
      .chip.save { color: var(--c-add); }
      .chip.save::before { content: "*"; }
      .group-body { display: flex; flex-direction: column; }
      .row { display: flex; gap: 10px; padding: 6px 10px; border-top: 1px dashed var(--line); }
      .group-body .row:first-child { border-top: 0; }
      .badge { flex-shrink: 0; min-width: 12ch; font-weight: 700; letter-spacing: .04em; }
      .badge::before { content: "["; opacity: .6; } .badge::after { content: "]"; opacity: .6; }
      .badge.retrieve { color: var(--c-retrieve); } .badge.candidates { color: var(--c-candidates); } .badge.add { color: var(--c-add); }
      .badge.update { color: var(--c-update); } .badge.delete { color: var(--c-delete); } .badge.noop { color: var(--c-noop); }
      .badge.summary { color: var(--c-summary); } .badge.error { color: var(--c-error); }
      .row-body { min-width: 0; word-break: break-word; }
      .muted { color: var(--muted); }
      .old { color: var(--muted); text-decoration: line-through; }
      .arrow { color: var(--c-update); margin: 0 6px; }
      .mem-list { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
      .mem-list li { display: flex; justify-content: space-between; gap: 12px; }
      .mem-list li::before { content: "- "; color: var(--muted); }
      .mem-list li span:first-child { flex: 1; }
      .score { flex-shrink: 0; color: var(--c-retrieve); font-variant-numeric: tabular-nums; }

      .mem-card { flex-shrink: 0; padding: 8px 10px; border: 1px solid var(--line); }
      .mem-card .date { margin-top: 4px; color: var(--muted); font-size: .74rem; }

      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
        .panel { height: 80vh; }
        .top { flex-direction: column; align-items: start; }
      }
    </style>
  </head>
  <body>
    <!-- ================= LOGIN ================= -->
    <div id="auth-view" class="auth hidden">
      <div class="auth-card">
        <p class="eyebrow">long-term memory terminal</p>
        <h1>MEMORY_CHAT<span class="cursor">█</span></h1>
        <div class="auth-tabs">
          <button type="button" class="active" data-auth-mode="login">sign in</button>
          <button type="button" data-auth-mode="signup">create account</button>
        </div>
        <form id="auth-form">
          <label class="field"><span>login:</span><input id="username" autocomplete="username" maxlength="32" required /></label>
          <label class="field"><span>password:</span><input id="password" type="password" autocomplete="current-password" maxlength="128" required /></label>
          <p class="auth-error" id="auth-error" role="alert"></p>
          <button id="auth-submit" class="primary" type="submit" style="align-self:flex-start">sign in</button>
        </form>
        <p class="auth-note">every account has its own private memory. passwords: 8+ characters.</p>
      </div>
    </div>

    <!-- ================= APP ================= -->
    <div id="app-view" class="hidden">
      <div class="wrap">
        <header class="top">
          <div>
            <p class="eyebrow">long-term memory terminal</p>
            <h1>MEMORY_CHAT<span class="cursor">█</span></h1>
          </div>
          <div class="who"><span id="who"></span><button id="logout" class="ghost" type="button">sign out</button></div>
        </header>

        <div class="grid">
          <!-- chat -->
          <section class="panel" aria-label="Chat">
            <div class="panel-head">
              <h2>chat</h2>
              <div class="head-actions">
                <span class="status" id="status">ready.</span>
                <button id="new-chat" class="ghost" type="button">new conversation</button>
              </div>
            </div>
            <div id="messages"></div>
            <form id="chat-form">
              <span class="prompt">&gt;</span>
              <textarea id="question" placeholder="type a message, Enter to send" aria-label="Message" required></textarea>
              <button id="send" class="primary" type="submit">send</button>
            </form>
          </section>

          <!-- dashboard -->
          <section class="panel" aria-label="Memory dashboard">
            <div class="panel-head">
              <h2>memory dashboard</h2>
              <button id="forget" class="ghost" type="button">clear my memory</button>
            </div>
            <div class="stats">
              <div class="stat"><span>memories</span><b id="stat-memories">0</b></div>
              <div class="stat retrieve"><span>retrieved</span><b id="stat-retrieve">0</b></div>
              <div class="stat add"><span>added</span><b id="stat-add">0</b></div>
              <div class="stat update"><span>updated</span><b id="stat-update">0</b></div>
              <div class="stat delete"><span>deleted</span><b id="stat-delete">0</b></div>
            </div>
            <div class="tabs">
              <button class="tab active" type="button" data-tab="activity">live activity</button>
              <button class="tab" type="button" data-tab="store">memory store</button>
            </div>
            <div id="activity" class="scroll"></div>
            <div id="store" class="scroll hidden"></div>
          </section>
        </div>
      </div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      // All dynamic text goes through textContent (never innerHTML): memories are
      // model-generated from user input.
      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }
      function note(text) { return el("p", "empty", text); }

      const CHAT_EMPTY = "Tell me something about yourself, then ask about it later. Start a new conversation and ask again: the memory stays.";
      const ACTIVITY_EMPTY = "Activity appears here as the assistant searches, adds, updates and deletes memories.";

      let authMode = "login";
      let lastEventId = 0;
      let pollTimer = null;
      let polling = false;
      const groups = new Map();

      /* ---------- api ---------- */
      async function api(path, options = {}) {
        const res = await fetch(path, {
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const raw = await res.text();
        let data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch {}
        if (res.status === 401 && !path.startsWith("/api/auth/")) {
          showAuth();
          throw new Error("Please sign in again.");
        }
        if (!res.ok) {
          const d = data && data.detail;
          const msg = Array.isArray(d) ? d.map((x) => x.msg).join("; ") : d;
          throw new Error(msg || raw || "The request failed.");
        }
        return data;
      }

      /* ---------- views ---------- */
      function showAuth() {
        clearInterval(pollTimer);
        $("#app-view").classList.add("hidden");
        $("#auth-view").classList.remove("hidden");
      }
      function showApp() {
        $("#auth-view").classList.add("hidden");
        $("#app-view").classList.remove("hidden");
      }

      /* ---------- auth ---------- */
      function setAuthMode(mode) {
        authMode = mode;
        document.querySelectorAll("[data-auth-mode]").forEach((b) =>
          b.classList.toggle("active", b.dataset.authMode === mode));
        $("#auth-submit").textContent = mode === "login" ? "sign in" : "create account";
        $("#password").autocomplete = mode === "login" ? "current-password" : "new-password";
        $("#password").minLength = mode === "signup" ? 8 : 1;
        $("#auth-error").textContent = "";
      }
      document.querySelectorAll("[data-auth-mode]").forEach((b) =>
        b.addEventListener("click", () => setAuthMode(b.dataset.authMode)));

      $("#auth-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = $("#auth-submit");
        btn.disabled = true;
        $("#auth-error").textContent = "";
        try {
          const data = await api(`/api/auth/${authMode}`, {
            method: "POST",
            body: JSON.stringify({ username: $("#username").value, password: $("#password").value }),
          });
          $("#password").value = "";
          await startApp(data.username);
        } catch (err) {
          $("#auth-error").textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      });

      $("#logout").addEventListener("click", async () => {
        try { await api("/api/auth/logout", { method: "POST" }); } catch {}
        showAuth();
      });

      /* ---------- app lifecycle ---------- */
      function resetState() {
        lastEventId = 0;
        groups.clear();
        $("#messages").replaceChildren(note(CHAT_EMPTY));
        $("#activity").replaceChildren(note(ACTIVITY_EMPTY));
        $("#store").replaceChildren();
        ["memories", "retrieve", "add", "update", "delete"].forEach((k) => ($(`#stat-${k}`).textContent = "0"));
        $("#status").textContent = "ready.";
      }

      async function startApp(username) {
        $("#who").textContent = `user: ${username}`;
        resetState();
        showApp();
        await Promise.all([loadHistory(), pollEvents(), loadMemories()]);
        clearInterval(pollTimer);
        pollTimer = setInterval(pollEvents, 1500);
      }

      /* ---------- chat ---------- */
      function addMessage(role, text) {
        const empty = $("#messages").querySelector(".empty");
        if (empty) empty.remove();
        $("#messages").appendChild(el("div", `message ${role}`, text));
        $("#messages").scrollTop = $("#messages").scrollHeight;
      }

      async function loadHistory() {
        try {
          const { messages } = await api("/api/chat/history");
          messages.forEach((m) => addMessage(m.role, m.content));
        } catch {}
      }

      $("#chat-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const question = $("#question").value.trim();
        if (!question) return;
        addMessage("user", question);
        $("#question").value = "";
        $("#send").disabled = true;
        $("#status").textContent = "thinking, checking memory...";
        try {
          const data = await api("/api/chat", { method: "POST", body: JSON.stringify({ question }) });
          addMessage("assistant", data.answer);
          $("#status").textContent = "memory active.";
          pollEvents();
        } catch (err) {
          addMessage("assistant", `error: ${err.message}`);
          $("#status").textContent = "connection problem.";
        } finally {
          $("#send").disabled = false;
          $("#question").focus();
        }
      });
      $("#question").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chat-form").requestSubmit(); }
      });

      $("#new-chat").addEventListener("click", async () => {
        try {
          await api("/api/chat/reset", { method: "POST" });
          $("#messages").replaceChildren(note("New conversation. Long-term memory is kept: ask about something you told me earlier."));
          $("#status").textContent = "conversation reset.";
        } catch {}
      });

      $("#forget").addEventListener("click", async () => {
        if (!confirm("Delete everything I remember about you, and the activity log?")) return;
        $("#forget").disabled = true;
        try {
          await api("/api/memory", { method: "DELETE" });
          resetState();
          $("#status").textContent = "memory cleared.";
        } catch (err) {
          $("#status").textContent = "could not clear memory.";
        } finally {
          $("#forget").disabled = false;
        }
      });

      /* ---------- dashboard ---------- */
      document.querySelectorAll(".tab").forEach((t) =>
        t.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
          $("#activity").classList.toggle("hidden", t.dataset.tab !== "activity");
          $("#store").classList.toggle("hidden", t.dataset.tab !== "store");
        }));

      function chips(list) {
        const wrap = el("div");
        (list || []).forEach((c) => wrap.appendChild(el("span", "chip", c)));
        return wrap;
      }
      function memList(items) {
        const ul = el("ul", "mem-list");
        items.forEach((m) => {
          const li = el("li");
          li.appendChild(el("span", "", m.text));
          li.appendChild(el("span", "score", Number(m.score).toFixed(2)));
          ul.appendChild(li);
        });
        return ul;
      }
      function row(type, ...children) {
        const r = el("div", "row");
        r.appendChild(el("span", `badge ${type}`, type.toUpperCase()));
        const body = el("div", "row-body");
        children.forEach((c) => c && body.appendChild(c));
        r.appendChild(body);
        return r;
      }

      function buildRow(ev) {
        const d = ev.data;
        switch (ev.type) {
          case "retrieve":
            return row("retrieve",
              el("div", "", `Searched memory for: "${d.query}"`),
              d.categories && d.categories.length ? chips(d.categories) : null,
              d.results.length ? memList(d.results) : el("div", "muted", "No matching memories found."));
          case "candidates":
            return row("candidates",
              el("div", "", d.memories.length
                ? `Updater compared the new message against ${d.memories.length} similar memories:`
                : "Updater found no similar memories to compare against."),
              d.memories.length ? memList(d.memories) : null);
          case "add":
            return row("add", el("div", "", d.text), chips(d.categories));
          case "update": {
            const line = el("div");
            line.appendChild(el("span", "old", d.old_text));
            line.appendChild(el("span", "arrow", "->"));
            line.appendChild(el("span", "", d.new_text));
            return row("update", line, chips(d.categories));
          }
          case "delete":
            return row("delete", el("div", "old", d.text));
          case "noop":
            return row("noop", el("div", "muted", "No change needed."));
          case "summary":
            return row("summary", el("div", "", `Updater summary: ${d.text}`));
          case "error":
            return row("error", el("div", "", d.message));
          default:
            return null;
        }
      }

      function makeGroup() {
        const root = el("article", "group");
        const head = el("div", "group-head");
        const title = el("div", "group-title", "Working...");
        const meta = el("div", "group-meta");
        head.append(title, meta);
        const body = el("div", "group-body");
        root.append(head, body);
        return { root, title, meta, body };
      }

      function groupFor(ev) {
        const key = ev.trace_id || `solo-${ev.id}`;
        let g = groups.get(key);
        if (!g) {
          g = makeGroup();
          if (!ev.trace_id) g.title.textContent = "Background activity";
          groups.set(key, g);
          const activity = $("#activity");
          const placeholder = activity.querySelector(".empty");
          if (placeholder) placeholder.remove();
          activity.prepend(g.root); // newest on top
        }
        return g;
      }

      function renderEvent(ev) {
        const g = groupFor(ev);
        const time = new Date(ev.ts).toLocaleTimeString();
        if (ev.type === "turn") {
          g.title.textContent = ev.data.question;
          g.meta.replaceChildren(
            el("div", "", time),
            el("span", ev.data.save_memory ? "chip save" : "chip",
               ev.data.save_memory ? "save requested" : "no save needed"));
          return;
        }
        if (ev.type === "error" && ev.data.question) {
          g.title.textContent = ev.data.question;
        }
        const r = buildRow(ev);
        if (r) g.body.appendChild(r);
        if (!g.meta.textContent) g.meta.textContent = time;
      }

      async function pollEvents() {
        if (polling) return;
        polling = true;
        try {
          const { events } = await api(`/api/dashboard/events?after_id=${lastEventId}`);
          if (!events.length) return;
          events.forEach(renderEvent);
          lastEventId = events[events.length - 1].id;
          await loadMemories();
        } catch {} finally {
          polling = false;
        }
      }

      async function loadMemories() {
        try {
          const { memories, counts } = await api("/api/dashboard/memories");
          $("#stat-memories").textContent = memories.length;
          $("#stat-retrieve").textContent = counts.retrieve || 0;
          $("#stat-add").textContent = counts.add || 0;
          $("#stat-update").textContent = counts.update || 0;
          $("#stat-delete").textContent = counts.delete || 0;

          const store = $("#store");
          store.replaceChildren();
          if (!memories.length) {
            store.appendChild(note("No memories stored yet. Tell the assistant something about yourself."));
            return;
          }
          memories.forEach((m) => {
            const card = el("div", "mem-card");
            card.appendChild(el("div", "", m.text));
            card.appendChild(chips(m.categories));
            const d = new Date(m.date);
            card.appendChild(el("div", "date", isNaN(d) ? m.date : d.toLocaleString()));
            store.appendChild(card);
          });
        } catch {}
      }

      /* ---------- boot ---------- */
      (async () => {
        try {
          const me = await api("/api/auth/me");
          await startApp(me.username);
        } catch {
          showAuth();
        }
      })();
    </script>
  </body>
</html>
